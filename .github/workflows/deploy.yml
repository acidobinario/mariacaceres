name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'design/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and test
        run: npm test
      # Each design/<name> branch is published as a preview at /mariacaceres/<name>/
      - name: Build design previews
        run: |
          for ref in $(git for-each-ref --format='%(refname:lstrip=4)' 'refs/remotes/origin/design/'); do
            git worktree add "../preview-$ref" "origin/design/$ref"
            (cd "../preview-$ref" && npm ci && npx astro build --base "/mariacaceres/$ref" --outDir "$GITHUB_WORKSPACE/dist/$ref")
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
